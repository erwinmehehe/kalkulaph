name: Runtime dependency security audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-security-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high
