name: Package production AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-aab.yml

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_BUILD_ID: 616b98a0-a7a1-4165-b10c-69a0c7680112

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download signed production AAB
        run: |
          mkdir -p release
          eas build:list --platform android --profile production --limit 10 --json --non-interactive > eas-builds.json
          ARTIFACT_URL="$(node -e "const fs=require('fs'); const builds=JSON.parse(fs.readFileSync('eas-builds.json','utf8')); const b=builds.find(x=>x.id===process.env.EAS_BUILD_ID); if(!b || b.status!=='FINISHED' || !b.artifacts?.applicationArchiveUrl) process.exit(1); process.stdout.write(b.artifacts.applicationArchiveUrl);")"
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output release/KalkulaPH-3.0.0-build13.aab
          test -s release/KalkulaPH-3.0.0-build13.aab
          file release/KalkulaPH-3.0.0-build13.aab
          sha256sum release/KalkulaPH-3.0.0-build13.aab > release/KalkulaPH-3.0.0-build13.sha256

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: KalkulaPH-3.0.0-build13-AAB
          path: |
            release/KalkulaPH-3.0.0-build13.aab
            release/KalkulaPH-3.0.0-build13.sha256
          if-no-files-found: error
          retention-days: 30
