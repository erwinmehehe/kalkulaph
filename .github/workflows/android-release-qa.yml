name: Android release QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release-qa.yml

permissions:
  contents: read
  actions: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download validated preview APK
        uses: actions/download-artifact@v4
        with:
          name: kalkulaph-preview-apk
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34830254733

      - name: Run Android release QA and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            mkdir -p store-screenshots qa-evidence
            adb wait-for-device
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system font_scale 1.0 || true
            adb shell cmd uimode night no || true
            adb shell am force-stop ph.kalkula.app
            adb shell am start -n ph.kalkula.app/.MainActivity || true
            sleep 15
            test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            adb exec-out screencap -p > store-screenshots/01-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            NEEDLE="Calculate take-home pay" python3 -c 'import os,re,xml.etree.ElementTree as ET; n=os.environ["NEEDLE"]; r=ET.parse("/tmp/window.xml").getroot(); a=[x for x in r.iter("node") if x.attrib.get("content-desc")==n or x.attrib.get("text")==n]; assert a,n; m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",a[0].attrib["bounds"]); print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)' > /tmp/coords
            adb shell input tap $(cut -d' ' -f1 /tmp/coords) $(cut -d' ' -f2 /tmp/coords)
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            NEEDLE="Monthly gross salary" python3 -c 'import os,re,xml.etree.ElementTree as ET; n=os.environ["NEEDLE"]; r=ET.parse("/tmp/window.xml").getroot(); a=[x for x in r.iter("node") if x.attrib.get("content-desc")==n or x.attrib.get("text")==n]; assert a,n; m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",a[0].attrib["bounds"]); print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)' > /tmp/coords
            adb shell input tap $(cut -d' ' -f1 /tmp/coords) $(cut -d' ' -f2 /tmp/coords)
            adb shell input text 50000
            adb shell input keyevent KEYCODE_BACK
            sleep 4
            adb exec-out screencap -p > store-screenshots/02-net-pay.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            NEEDLE="Back to home" python3 -c 'import os,re,xml.etree.ElementTree as ET; n=os.environ["NEEDLE"]; r=ET.parse("/tmp/window.xml").getroot(); a=[x for x in r.iter("node") if x.attrib.get("content-desc")==n or x.attrib.get("text")==n]; assert a,n; m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",a[0].attrib["bounds"]); print((int(m[1])+int(m[3]))//2,(int(m[2])+int(m[4]))//2)' > /tmp/coords
            adb shell input tap $(cut -d' ' -f1 /tmp/coords) $(cut -d' ' -f2 /tmp/coords)
            sleep 4
            adb shell input tap 675 1810
            sleep 4
            adb exec-out screencap -p > store-screenshots/03-retirement.png
            adb shell input tap 935 1810
            sleep 4
            adb exec-out screencap -p > store-screenshots/04-settings.png
            adb shell wm size 720x1600
            adb shell wm density 320
            adb shell input tap 90 1510
            adb shell settings put system font_scale 1.0 || true
            adb shell cmd uimode night no || true
            adb shell am force-stop ph.kalkula.app
            adb shell am start -n ph.kalkula.app/.MainActivity || true
            sleep 12
            test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            adb exec-out screencap -p > qa-evidence/home-360dp.png
            adb shell settings put system font_scale 1.3 || true
            adb shell am force-stop ph.kalkula.app
            adb shell am start -n ph.kalkula.app/.MainActivity || true
            sleep 12
            test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            adb exec-out screencap -p > qa-evidence/home-360dp-font130.png
            adb shell settings put system font_scale 1.0 || true
            adb shell cmd uimode night yes || true
            adb shell am force-stop ph.kalkula.app
            adb shell am start -n ph.kalkula.app/.MainActivity || true
            sleep 12
            test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            adb exec-out screencap -p > qa-evidence/home-360dp-dark.png
            adb shell cmd uimode night no || true
            adb shell cmd connectivity airplane-mode enable || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am force-stop ph.kalkula.app
            adb shell am start -n ph.kalkula.app/.MainActivity || true
            sleep 12
            test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            adb exec-out screencap -p > qa-evidence/home-360dp-offline.png
            adb shell cmd connectivity airplane-mode disable || true
            adb shell svc wifi enable || true
            adb shell svc data enable || true
            adb shell uiautomator dump /sdcard/kalkulaph-window.xml >/dev/null
            adb pull /sdcard/kalkulaph-window.xml qa-evidence/window.xml >/dev/null
            adb logcat -d > qa-evidence/android-logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL" qa-evidence/android-logcat.txt
            test -s store-screenshots/01-home.png
            test -s store-screenshots/02-net-pay.png
            test -s store-screenshots/03-retirement.png
            test -s store-screenshots/04-settings.png
            test -s qa-evidence/home-360dp.png
            test -s qa-evidence/home-360dp-font130.png
            test -s qa-evidence/home-360dp-dark.png
            test -s qa-evidence/home-360dp-offline.png

      - name: Upload Play Store screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kalkulaph-play-store-screenshots
          path: store-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kalkulaph-android-release-qa
          path: qa-evidence/*
          if-no-files-found: warn
          retention-days: 30
