name: Android smoke QA

on:
  workflow_run:
    workflows: ["Android preview APK"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-smoke.yml

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download preview APK
        uses: actions/download-artifact@v4
        with:
          name: kalkulaph-preview-apk
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || 34830254733 }}

      - name: Launch on narrow Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set -e
            adb wait-for-device
            adb install -r apk/app-debug.apk
            adb shell wm size 720x1600
            adb shell wm density 320
            adb logcat -c

            launch_and_assert() {
              adb shell am force-stop ph.kalkula.app
              adb shell am start -W -n ph.kalkula.app/.MainActivity
              sleep 5
              test -n "$(adb shell pidof ph.kalkula.app | tr -d '\r')"
            }

            launch_and_assert
            adb exec-out screencap -p > home-360dp.png

            adb shell settings put system font_scale 1.3 || true
            launch_and_assert
            adb exec-out screencap -p > home-360dp-font130.png

            adb shell settings put system font_scale 1.0 || true
            adb shell cmd uimode night yes || true
            launch_and_assert
            adb exec-out screencap -p > home-360dp-dark.png

            adb shell svc wifi disable || true
            adb shell svc data disable || true
            launch_and_assert
            adb exec-out screencap -p > home-360dp-offline.png
            adb shell svc wifi enable || true
            adb shell svc data enable || true

            adb shell uiautomator dump /sdcard/kalkulaph-window.xml
            adb pull /sdcard/kalkulaph-window.xml window.xml
            adb logcat -d > android-logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL" android-logcat.txt; then
              echo "Android crash detected"
              exit 1
            fi

      - name: Upload visual QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kalkulaph-android-smoke-qa
          path: |
            home-360dp.png
            home-360dp-font130.png
            home-360dp-dark.png
            home-360dp-offline.png
            window.xml
            android-logcat.txt
          if-no-files-found: warn
          retention-days: 14
