name: App release polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-release-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add in-app privacy policy link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old_import = "Alert, FlatList, KeyboardAvoidingView, Modal, Platform, Pressable, ScrollView, StyleSheet, Text, TextInput, useColorScheme, View"
          new_import = "Alert, FlatList, KeyboardAvoidingView, Linking, Modal, Platform, Pressable, ScrollView, StyleSheet, Text, TextInput, useColorScheme, View"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          private_card = '<View style={s.settingsCard}><Text style={s.listTitle}>Private by default</Text><Text style={s.listSub}>KalkulaPH stores job history on this device. Calculator entries are not uploaded.</Text></View>'
          privacy_card = private_card + '<View style={s.settingsCard}><Text style={s.listTitle}>Privacy policy</Text><Text style={s.listSub}>Review what KalkulaPH stores locally and how public rate checks work.</Text><Pressable onPress={()=>Linking.openURL(\'https://github.com/erwinmehehe/kalkulaph/blob/main/PRIVACY.md\')} style={s.dangerButton} accessibilityRole="link" accessibilityLabel="Open KalkulaPH privacy policy"><Text style={s.action}>Open privacy policy</Text></Pressable></View>'
          if 'Open privacy policy' not in s:
              if private_card not in s:
                  raise SystemExit('Settings insertion point not found')
              s = s.replace(private_card, privacy_card, 1)
          p.write_text(s)
          PY

      - name: Verify app
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Commit privacy link
        run: |
          if git diff --quiet; then
            echo "No app changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Add in-app privacy policy link"
          git push
