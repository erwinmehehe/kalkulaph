name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - App.tsx
      - app.json
      - package.json
      - package-lock.json
      - assets/**
      - src/**
      - .github/workflows/android-preview.yml

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: |
          npm test
          npm run typecheck
          npm run validate:rates

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify no Advertising ID permission
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          unzip -p "$APK" AndroidManifest.xml > /tmp/AndroidManifest.xml.bin
          if strings -el /tmp/AndroidManifest.xml.bin | grep -Fq 'com.google.android.gms.permission.AD_ID'; then
            echo 'Advertising ID permission detected in release APK.'
            exit 1
          fi
          for DEX in $(unzip -Z1 "$APK" | grep '^classes.*\.dex$'); do
            if unzip -p "$APK" "$DEX" | strings | grep -Eq 'AdvertisingIdClient|com/google/android/gms/ads|firebase\.analytics|appsflyer|adjust\.sdk'; then
              echo "Advertising or attribution SDK signature detected in $DEX."
              exit 1
            fi
          done
          echo 'No Advertising ID permission or common ad/attribution SDK signature detected.'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulaph-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
