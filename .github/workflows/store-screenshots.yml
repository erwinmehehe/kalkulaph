name: Generate Play Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/store-screenshots.yml

permissions:
  contents: read
  actions: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download validated preview APK
        uses: actions/download-artifact@v4
        with:
          name: kalkulaph-preview-apk
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34830254733

      - name: Capture Play Store phone screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p store-screenshots
            adb install -r apk/app-debug.apk
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            adb shell am force-stop ph.kalkula.app
            adb shell am start -W -n ph.kalkula.app/.MainActivity
            sleep 5

            tap_node() {
              local needle="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              read -r X Y <<< "$(NEEDLE="$needle" python3 - <<'PY'
            import os, re, sys, xml.etree.ElementTree as ET
            needle=os.environ['NEEDLE']
            root=ET.parse('/tmp/window.xml').getroot()
            for node in root.iter('node'):
                if node.attrib.get('content-desc') == needle or node.attrib.get('text') == needle:
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        print((x1+x2)//2, (y1+y2)//2)
                        sys.exit(0)
            sys.exit(1)
            PY
              )"
              adb shell input tap "$X" "$Y"
              sleep 2
            }

            adb exec-out screencap -p > store-screenshots/01-home.png

            tap_node "Calculate take-home pay"
            tap_node "Monthly gross salary"
            adb shell input text 50000
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb exec-out screencap -p > store-screenshots/02-net-pay.png

            tap_node "Back to home"
            adb shell input tap 675 1810
            sleep 3
            adb exec-out screencap -p > store-screenshots/03-retirement.png

            adb shell input tap 935 1810
            sleep 3
            adb exec-out screencap -p > store-screenshots/04-settings.png

            for image in store-screenshots/*.png; do
              test -s "$image"
              file "$image"
            done

      - name: Upload Play Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kalkulaph-play-store-screenshots
          path: store-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
